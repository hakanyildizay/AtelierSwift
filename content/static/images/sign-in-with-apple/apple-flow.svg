<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Sign in with Apple, from the button to the tokens</title>
  <desc id="desc">The iOS app makes a random nonce and keeps it. It asks Apple to sign the user in, passing the SHA-256 of the nonce. After Face ID, Apple returns an identity token, a JWT signed by Apple, and the user's name on the first sign-in only. The app posts the identity token, the raw nonce and the name to POST /api/auth/apple. AuthService fetches Apple's public keys, which Apple doesn't allow to be cached, and req.jwt.apple.verify checks the signature, the issuer, the expiry and the audience. AuthService itself checks that the token's nonce is the SHA-256 of the raw nonce. If any check fails it answers 401. Otherwise it finds, links or creates the user in the database and returns an access token and a refresh token, the same response as a password login.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .label { font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .code { font-size: 11px; fill: #a5d6ff; }
      .note { font-size: 11.5px; fill: #c9d1d9; }
      .small { font-size: 10.5px; fill: #8b949e; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .ok { font-size: 12px; font-weight: 700; fill: #3fb950; }
      .claim { font-size: 11.5px; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="719" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Participants -->
  <g class="sans" text-anchor="middle">
    <rect x="25" y="20" width="130" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="40" class="title">iOS app</text>
    <text x="90" y="56" class="sub">AuthenticationServices</text>

    <rect x="235" y="20" width="130" height="44" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-opacity="0.7"/>
    <text x="300" y="40" class="title">Apple</text>
    <text x="300" y="56" class="sub">signs the identity token</text>

    <rect x="440" y="20" width="140" height="44" rx="8" fill="#21262d" stroke="#e3b341" stroke-opacity="0.7"/>
    <text x="510" y="40" class="title">AuthService</text>
    <text x="510" y="56" class="sub">verifies it</text>

    <path d="M650,26 a40,7 0 0 0 80,0 a40,7 0 0 0 -80,0 v32 a40,7 0 0 0 80,0 v-32" fill="#21262d" stroke="#8b949e" stroke-opacity="0.8"/>
    <text x="690" y="50" class="title">Database</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="90" y1="64" x2="90" y2="636"/>
    <line x1="300" y1="64" x2="300" y2="636"/>
    <line x1="510" y1="64" x2="510" y2="636"/>
    <line x1="690" y1="66" x2="690" y2="636"/>
  </g>

  <!-- 1. Nonce -->
  <rect x="20" y="82" width="140" height="40" rx="6" fill="#21262d" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="90" y="99" class="sans label" text-anchor="middle">random <tspan class="mono code" style="font-size:12px">nonce</tspan></text>
  <text x="90" y="114" class="sans small" text-anchor="middle">kept in memory</text>

  <!-- 2. Authorization request -->
  <text x="195" y="142" class="mono code" text-anchor="middle">nonce: sha256(nonce)</text>
  <line x1="94" y1="152" x2="296" y2="152" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="225" y="164" width="150" height="38" rx="6" fill="#21262d" stroke="#d2a8ff" stroke-opacity="0.7"/>
  <text x="300" y="180" class="sans note" text-anchor="middle">Face ID or passcode</text>
  <text x="300" y="195" class="sans small" text-anchor="middle">share or hide the email</text>

  <!-- 3. Identity token -->
  <text x="195" y="222" class="sans label" text-anchor="middle" style="fill:#3fb950">identityToken</text>
  <text x="195" y="236" class="sans small" text-anchor="middle">+ fullName, first time only</text>
  <line x1="296" y1="246" x2="94" y2="246" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- 4. POST to AuthService -->
  <text x="412" y="270" class="mono code" text-anchor="middle">POST /api/auth/apple</text>
  <text x="412" y="285" class="mono code" text-anchor="middle" style="fill:#8b949e">{ identityToken, nonce, name }</text>
  <rect x="294" y="290" width="12" height="14" fill="#161b22"/>
  <line x1="94" y1="296" x2="506" y2="296" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 5. Apple's JWKS -->
  <text x="405" y="322" class="sans small" text-anchor="middle">Apple's public keys (JWKS), every time</text>
  <line x1="506" y1="332" x2="304" y2="332" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- 6. Checks -->
  <rect x="330" y="348" width="410" height="186" rx="6" fill="#21262d" stroke="#e3b341" stroke-opacity="0.7"/>
  <g class="sans">
    <text x="346" y="368" class="small">Vapor checks, in <tspan class="mono code" style="fill:#e3b341">req.jwt.apple.verify(…)</tspan></text>

    <text x="346" y="392" class="ok">✓</text>
    <text x="364" y="392" class="mono claim">signature</text>
    <text x="446" y="392" class="note">🔑 Apple's public key, picked by <tspan class="mono code">kid</tspan></text>

    <text x="346" y="414" class="ok">✓</text>
    <text x="364" y="414" class="mono claim">iss</text>
    <text x="446" y="414" class="note">= <tspan class="mono code">https://appleid.apple.com</tspan></text>

    <text x="346" y="436" class="ok">✓</text>
    <text x="364" y="436" class="mono claim">exp</text>
    <text x="446" y="436" class="note">still ahead</text>

    <text x="346" y="458" class="ok">✓</text>
    <text x="364" y="458" class="mono claim">aud</text>
    <text x="446" y="458" class="note">= our bundle ID, <tspan class="mono code">APPLE_APP_ID</tspan></text>

    <line x1="346" y1="472" x2="724" y2="472" stroke="#30363d"/>
    <text x="346" y="492" class="small">Vapor leaves this one to us:</text>

    <text x="346" y="516" class="ok">✓</text>
    <text x="364" y="516" class="mono claim">nonce</text>
    <text x="446" y="516" class="note">= <tspan class="mono code">sha256(nonce)</tspan> of the nonce we were sent</text>
  </g>

  <!-- Failure -->
  <text x="200" y="444" class="sans label" text-anchor="middle" style="fill:#ff7b72">401</text>
  <text x="200" y="459" class="sans small" text-anchor="middle">if any check fails</text>
  <rect x="294" y="464" width="12" height="12" fill="#161b22"/>
  <line x1="326" y1="470" x2="94" y2="470" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>

  <!-- 7. Database -->
  <text x="595" y="556" class="sans small" text-anchor="middle">find, link or create</text>
  <text x="595" y="569" class="sans small" text-anchor="middle">the user</text>
  <line x1="514" y1="578" x2="686" y2="578" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- 8. Tokens -->
  <text x="405" y="598" class="mono code" text-anchor="middle" style="fill:#3fb950">accessToken + refreshToken</text>
  <text x="405" y="612" class="sans small" text-anchor="middle">the same response as /login</text>
  <rect x="294" y="616" width="12" height="12" fill="#161b22"/>
  <line x1="506" y1="622" x2="94" y2="622" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- Footer -->
  <line x1="24" y1="656" x2="736" y2="656" stroke="#30363d"/>
  <text x="24" y="680" class="sans muted">Apple signs the identity token and AuthService only verifies it, like WorkoutEngine verifies AuthService's tokens.</text>
  <text x="24" y="698" class="sans muted">Once the checks pass, the user gets the same tokens as with a password login.</text>
</svg>
