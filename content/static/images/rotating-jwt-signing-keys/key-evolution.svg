<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc">
  <title id="title">How token signing evolved</title>
  <desc id="desc">Stage 1: AuthService and WorkoutEngine share one HS256 secret, so both can sign; a leak anywhere lets anyone create tokens. Stage 2: AuthService holds an ES256 private key and WorkoutEngine a copy of the public key; changing the key means updating every service at once. Stage 3: AuthService holds a keyring of private keys with key ids and publishes the public keys as a JWKS, which WorkoutEngine fetches; new keys reach verifiers without a redeploy.</desc>

  <defs>
    <symbol id="key" viewBox="0 0 18 12">
      <circle cx="4.5" cy="6" r="3.5" fill="none" stroke-width="1.6"/>
      <path d="M8 6 H17 M13.5 6 V9.5 M16.5 6 V8.5" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .stage { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .when { font-size: 11px; fill: #8b949e; }
      .svc { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .chip { font-size: 11.5px; fill: #c9d1d9; }
      .chipcode { font-size: 10.5px; fill: #a5d6ff; }
      .link { font-size: 11px; fill: #8b949e; }
      .note { font-size: 12px; }
      .num { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="429" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- ============ Stage 1 ============ -->
  <g class="sans">
    <circle cx="44" cy="44" r="11" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <text x="44" y="48" class="num" text-anchor="middle">1</text>
    <text x="62" y="41" class="stage">One shared secret</text>
    <text x="62" y="57" class="when">HS256 · 2024</text>

    <rect x="24" y="80" width="228" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="40" y="104" class="svc">AuthService</text>
    <rect x="40" y="118" width="196" height="28" rx="6" fill="#e3b341" fill-opacity="0.12" stroke="#e3b341" stroke-opacity="0.7"/>
    <use href="#key" x="50" y="126" width="18" height="12" stroke="#e3b341"/>
    <text x="76" y="136" class="chip">secret · signs and verifies</text>

    <line x1="138" y1="160" x2="138" y2="206" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="148" y="187" class="link">same secret copied</text>

    <rect x="24" y="206" width="228" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="40" y="230" class="svc">WorkoutEngine</text>
    <rect x="40" y="244" width="196" height="28" rx="6" fill="#ff7b72" fill-opacity="0.12" stroke="#ff7b72" stroke-opacity="0.7"/>
    <use href="#key" x="50" y="252" width="18" height="12" stroke="#ff7b72"/>
    <text x="76" y="262" class="chip">secret · verifies, <tspan fill="#ff7b72">could sign</tspan></text>

    <rect x="24" y="314" width="228" height="92" rx="8" fill="#ff7b72" fill-opacity="0.07" stroke="#ff7b72" stroke-opacity="0.5"/>
    <text x="40" y="340" class="note" fill="#ff7b72">A leak in any service lets</text>
    <text x="40" y="358" class="note" fill="#ff7b72">anyone create valid tokens.</text>
    <text x="40" y="384" class="link">Every verifier is also a signer.</text>
  </g>

  <!-- ============ Stage 2 ============ -->
  <g class="sans">
    <circle cx="286" cy="44" r="11" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <text x="286" y="48" class="num" text-anchor="middle">2</text>
    <text x="304" y="41" class="stage">One key pair</text>
    <text x="304" y="57" class="when">ES256 · Sep 12, 2026</text>

    <rect x="266" y="80" width="228" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="282" y="104" class="svc">AuthService</text>
    <rect x="282" y="118" width="196" height="28" rx="6" fill="#e3b341" fill-opacity="0.12" stroke="#e3b341" stroke-opacity="0.7"/>
    <use href="#key" x="292" y="126" width="18" height="12" stroke="#e3b341"/>
    <text x="318" y="136" class="chip">private key · signs</text>

    <line x1="380" y1="160" x2="380" y2="206" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="390" y="181" class="link">public key</text>
    <text x="390" y="195" class="link">copied by hand</text>

    <rect x="266" y="206" width="228" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="282" y="230" class="svc">WorkoutEngine</text>
    <rect x="282" y="244" width="196" height="28" rx="6" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.7"/>
    <use href="#key" x="292" y="252" width="18" height="12" stroke="#58a6ff"/>
    <text x="318" y="262" class="chip">public key · verifies only</text>

    <rect x="266" y="314" width="228" height="92" rx="8" fill="#e3b341" fill-opacity="0.07" stroke="#e3b341" stroke-opacity="0.5"/>
    <text x="282" y="340" class="note" fill="#e3b341">A new key means updating</text>
    <text x="282" y="358" class="note" fill="#e3b341">every service at the same time.</text>
    <text x="282" y="384" class="link">Only AuthService can sign.</text>
  </g>

  <!-- ============ Stage 3 ============ -->
  <g class="sans">
    <circle cx="528" cy="44" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="528" y="48" class="num" text-anchor="middle">3</text>
    <text x="546" y="41" class="stage">Keyring + JWKS</text>
    <text x="546" y="57" class="when">ES256 · Sep 14, 2026</text>

    <rect x="508" y="80" width="228" height="80" rx="8" fill="#21262d" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="524" y="102" class="svc">AuthService</text>
    <rect x="524" y="112" width="196" height="20" rx="5" fill="#e3b341" fill-opacity="0.08" stroke="#e3b341" stroke-opacity="0.4"/>
    <use href="#key" x="532" y="116" width="16" height="11" stroke="#e3b341" stroke-opacity="0.6"/>
    <text x="554" y="126" class="mono chipcode">key-2026-09-13</text>
    <rect x="524" y="136" width="196" height="20" rx="5" fill="#e3b341" fill-opacity="0.15" stroke="#e3b341"/>
    <use href="#key" x="532" y="140" width="16" height="11" stroke="#e3b341"/>
    <text x="554" y="150" class="mono chipcode">key-2026-10-22</text>
    <text x="712" y="150" class="sans" font-size="10" font-weight="600" fill="#e3b341" text-anchor="end">SIGNS</text>

    <line x1="622" y1="204" x2="622" y2="163" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="612" y="181" class="mono" font-size="10.5" fill="#58a6ff" text-anchor="end">GET /.well-known/</text>
    <text x="612" y="195" class="mono" font-size="10.5" fill="#58a6ff" text-anchor="end">jwks.json</text>

    <rect x="508" y="206" width="228" height="80" rx="8" fill="#21262d" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="524" y="230" class="svc">WorkoutEngine</text>
    <rect x="524" y="244" width="196" height="28" rx="6" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.7"/>
    <use href="#key" x="534" y="252" width="18" height="12" stroke="#58a6ff"/>
    <text x="560" y="262" class="chip">public keys, cached by kid</text>

    <rect x="508" y="314" width="228" height="92" rx="8" fill="#3fb950" fill-opacity="0.07" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="524" y="340" class="note" fill="#3fb950">New keys reach the verifiers</text>
    <text x="524" y="358" class="note" fill="#3fb950">without a redeploy.</text>
    <text x="524" y="384" class="link">Old and new keys valid side by side.</text>
  </g>
</svg>
