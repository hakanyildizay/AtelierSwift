<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">JWKSVerifier during an outage</title>
  <desc id="desc">While healthy, WorkoutEngine verifies tokens with cached keys and refreshes them when the cache is older than 5 minutes. When AuthService becomes unreachable, the verifier is degraded: tokens with a known kid are still accepted from the cache, tokens with a new kid get 401, and fetch attempts are limited to one every 15 seconds. 20 minutes after the last successful fetch it becomes unavailable and rejects every token. When AuthService is reachable again, the next attempt succeeds and the verifier is healthy. Each state change is logged once.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .state { font-size: 12.5px; font-weight: 700; }
      .row { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .rowsub { font-size: 10.5px; fill: #8b949e; }
      .cell { font-size: 11px; fill: #c9d1d9; }
      .ok { font-size: 11px; font-weight: 600; fill: #3fb950; }
      .bad { font-size: 11px; font-weight: 600; fill: #ff7b72; }
      .event { font-size: 10.5px; fill: #d2a8ff; }
      .muted { font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- State bar -->
  <g class="sans" text-anchor="middle">
    <rect x="190" y="28" width="108" height="32" rx="6" fill="#3fb950" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.7"/>
    <text x="244" y="49" class="state" fill="#3fb950">Healthy</text>
    <rect x="302" y="28" width="216" height="32" rx="6" fill="#e3b341" fill-opacity="0.2" stroke="#e3b341" stroke-opacity="0.7"/>
    <text x="410" y="49" class="state" fill="#e3b341">Degraded</text>
    <rect x="522" y="28" width="124" height="32" rx="6" fill="#ff7b72" fill-opacity="0.2" stroke="#ff7b72" stroke-opacity="0.7"/>
    <text x="584" y="49" class="state" fill="#ff7b72">Unavailable</text>
    <rect x="650" y="28" width="86" height="32" rx="6" fill="#3fb950" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.7"/>
    <text x="693" y="49" class="state" fill="#3fb950">Healthy</text>
  </g>

  <!-- Column boundaries -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="300" y1="64" x2="300" y2="292"/>
    <line x1="520" y1="64" x2="520" y2="310"/>
    <line x1="648" y1="64" x2="648" y2="292"/>
  </g>

  <!-- Row labels -->
  <g class="sans">
    <text x="24" y="94" class="row">Token, known kid</text>
    <text x="24" y="109" class="rowsub">the usual case</text>
    <text x="24" y="144" class="row">Token, new kid</text>
    <text x="24" y="159" class="rowsub">right after a key switch</text>
    <text x="24" y="194" class="row">JWKS fetches</text>
    <text x="24" y="209" class="rowsub">to AuthService</text>
    <text x="24" y="244" class="row">Log</text>
    <text x="24" y="259" class="rowsub">once per state change</text>
  </g>

  <!-- Row separators -->
  <g stroke="#21262d">
    <line x1="24" y1="124" x2="736" y2="124"/>
    <line x1="24" y1="174" x2="736" y2="174"/>
    <line x1="24" y1="224" x2="736" y2="224"/>
    <line x1="24" y1="274" x2="736" y2="274"/>
  </g>

  <!-- Known kid -->
  <g class="sans" text-anchor="middle">
    <text x="244" y="104" class="ok">✓ accepted</text>
    <text x="410" y="98" class="ok">✓ accepted</text>
    <text x="410" y="114" class="cell">from the cached keys</text>
    <text x="584" y="104" class="bad">✗ 401</text>
    <text x="693" y="104" class="ok">✓ accepted</text>
  </g>

  <!-- New kid -->
  <g class="sans" text-anchor="middle">
    <text x="244" y="148" class="ok">✓ after a refetch</text>
    <text x="410" y="148" class="bad">✗ 401</text>
    <text x="410" y="164" class="cell">the refetch fails</text>
    <text x="584" y="154" class="bad">✗ 401</text>
    <text x="693" y="154" class="ok">✓ accepted</text>
  </g>

  <!-- Fetches -->
  <g class="sans" text-anchor="middle">
    <text x="244" y="198" class="cell">when the cache</text>
    <text x="244" y="214" class="cell">is &gt; 5 min old</text>
    <text x="410" y="204" class="cell">at most 1 attempt per 15 s</text>
    <text x="584" y="198" class="cell">at most 1 attempt</text>
    <text x="584" y="214" class="cell">per 15 s</text>
    <text x="693" y="198" class="cell">when the cache</text>
    <text x="693" y="214" class="cell">is &gt; 5 min old</text>
  </g>

  <!-- Log -->
  <g class="sans" text-anchor="middle">
    <text x="244" y="254" class="cell">—</text>
    <text x="410" y="254" class="cell" style="fill:#e3b341">warning</text>
    <text x="584" y="254" class="cell" style="fill:#ff7b72">error</text>
    <text x="693" y="254" class="cell">notice</text>
  </g>

  <!-- Events -->
  <g class="sans">
    <circle cx="300" cy="292" r="4" fill="#d2a8ff"/>
    <text x="300" y="310" class="event" text-anchor="middle">AuthService unreachable</text>
    <circle cx="520" cy="310" r="4" fill="#d2a8ff"/>
    <text x="520" y="328" class="event" text-anchor="middle">20 min after the last successful fetch</text>
    <circle cx="648" cy="292" r="4" fill="#d2a8ff"/>
    <text x="648" y="310" class="event" text-anchor="middle">reachable again</text>
  </g>

  <!-- Footer -->
  <line x1="24" y1="350" x2="736" y2="350" stroke="#30363d"/>
  <text x="24" y="374" class="sans muted">A verifier that can't reach AuthService can't learn that a key was removed either,</text>
  <text x="24" y="392" class="sans muted">so after 20 minutes it stops trusting its copy and rejects every token: it fails closed.</text>
</svg>
