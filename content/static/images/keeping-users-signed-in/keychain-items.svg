<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">What the app keeps in the Keychain</title>
  <desc id="desc">Five Keychain items under the service app.exerciselab.session: accessToken, refreshToken, userId, userName and userEmail. Signing in or verifying the email saves all five. A token refresh replaces only the two tokens. App launch reads all five. Signing out, or a rejected refresh, deletes all five.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .h1 { font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .meta { font-size: 11px; fill: #a5d6ff; }
      .metalabel { font-size: 11px; fill: #8b949e; }
      .colhead { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .colsub { font-size: 10.5px; fill: #8b949e; }
      .key { font-size: 12.5px; fill: #a5d6ff; }
      .keysub { font-size: 10.5px; fill: #8b949e; }
      .badge { font-size: 11px; font-weight: 600; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .group { font-size: 10px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Keychain header -->
  <rect x="24" y="20" width="712" height="58" rx="8" fill="#21262d" stroke="#30363d"/>
  <g fill="none" stroke="#e3b341" stroke-width="2">
    <path d="M44,44 v-6 a8,8 0 0 1 16,0 v6"/>
    <rect x="40" y="44" width="24" height="18" rx="3" fill="#e3b341" fill-opacity="0.15"/>
  </g>
  <circle cx="52" cy="53" r="2.2" fill="#e3b341"/>
  <text x="78" y="44" class="sans h1">iOS Keychain</text>
  <text x="78" y="64" class="sans metalabel">service <tspan class="mono meta">app.exerciselab.session</tspan>   ·   accessible <tspan class="mono meta">AfterFirstUnlock</tspan></text>

  <!-- Column headers -->
  <g class="sans" text-anchor="middle">
    <text x="321" y="110" class="colhead">Sign in</text>
    <text x="321" y="126" class="colsub">or email verified</text>
    <text x="440" y="110" class="colhead">Token refreshed</text>
    <text x="440" y="126" class="colsub">about every 15 min</text>
    <text x="558" y="110" class="colhead">App launch</text>
    <text x="558" y="126" class="colsub">restore the session</text>
    <text x="677" y="110" class="colhead">Sign out</text>
    <text x="677" y="126" class="colsub">or refresh rejected</text>
  </g>
  <line x1="24" y1="138" x2="736" y2="138" stroke="#30363d"/>

  <!-- Column bands -->
  <g fill="#ffffff" fill-opacity="0.02">
    <rect x="262" y="92" width="118" height="290"/>
    <rect x="499" y="92" width="118" height="290"/>
  </g>

  <!-- Group labels -->
  <text x="24" y="156" class="sans group">TOKENS</text>
  <text x="24" y="268" class="sans group">PROFILE</text>
  <line x1="24" y1="252" x2="736" y2="252" stroke="#30363d" stroke-dasharray="3 4"/>

  <!-- Row keys -->
  <g class="sans">
    <text x="24" y="182" class="mono key">accessToken</text>
    <text x="24" y="197" class="keysub">JWT, sent as Bearer</text>
    <text x="24" y="224" class="mono key">refreshToken</text>
    <text x="24" y="239" class="keysub">40 characters, for /auth/refreshToken</text>
    <text x="24" y="284" class="mono key">userId</text>
    <text x="24" y="299" class="keysub">user id</text>
    <text x="24" y="324" class="mono key">userName</text>
    <text x="24" y="339" class="keysub">display name</text>
    <text x="24" y="364" class="mono key">userEmail</text>
    <text x="24" y="379" class="keysub">email address</text>
  </g>

  <!-- Badges -->
  <g class="sans badge" text-anchor="middle">
    <!-- save (sign in) -->
    <g>
      <rect x="291" y="174" width="60" height="22" rx="11" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950"/>
      <text x="321" y="189" fill="#3fb950">save</text>
      <rect x="291" y="216" width="60" height="22" rx="11" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950"/>
      <text x="321" y="231" fill="#3fb950">save</text>
      <rect x="291" y="276" width="60" height="22" rx="11" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950"/>
      <text x="321" y="291" fill="#3fb950">save</text>
      <rect x="291" y="316" width="60" height="22" rx="11" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950"/>
      <text x="321" y="331" fill="#3fb950">save</text>
      <rect x="291" y="356" width="60" height="22" rx="11" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950"/>
      <text x="321" y="371" fill="#3fb950">save</text>
    </g>
    <!-- replace (refresh) -->
    <g>
      <rect x="405" y="174" width="70" height="22" rx="11" fill="#d2a8ff" fill-opacity="0.18" stroke="#d2a8ff"/>
      <text x="440" y="189" fill="#d2a8ff">replace</text>
      <rect x="405" y="216" width="70" height="22" rx="11" fill="#d2a8ff" fill-opacity="0.18" stroke="#d2a8ff"/>
      <text x="440" y="231" fill="#d2a8ff">replace</text>
      <text x="440" y="291" fill="#484f58">—</text>
      <text x="440" y="331" fill="#484f58">—</text>
      <text x="440" y="371" fill="#484f58">—</text>
    </g>
    <!-- read (launch) -->
    <g>
      <rect x="528" y="174" width="60" height="22" rx="11" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
      <text x="558" y="189" fill="#58a6ff">read</text>
      <rect x="528" y="216" width="60" height="22" rx="11" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
      <text x="558" y="231" fill="#58a6ff">read</text>
      <rect x="528" y="276" width="60" height="22" rx="11" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
      <text x="558" y="291" fill="#58a6ff">read</text>
      <rect x="528" y="316" width="60" height="22" rx="11" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
      <text x="558" y="331" fill="#58a6ff">read</text>
      <rect x="528" y="356" width="60" height="22" rx="11" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
      <text x="558" y="371" fill="#58a6ff">read</text>
    </g>
    <!-- delete (sign out) -->
    <g>
      <rect x="647" y="174" width="60" height="22" rx="11" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/>
      <text x="677" y="189" fill="#ff7b72">delete</text>
      <rect x="647" y="216" width="60" height="22" rx="11" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/>
      <text x="677" y="231" fill="#ff7b72">delete</text>
      <rect x="647" y="276" width="60" height="22" rx="11" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/>
      <text x="677" y="291" fill="#ff7b72">delete</text>
      <rect x="647" y="316" width="60" height="22" rx="11" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/>
      <text x="677" y="331" fill="#ff7b72">delete</text>
      <rect x="647" y="356" width="60" height="22" rx="11" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/>
      <text x="677" y="371" fill="#ff7b72">delete</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="24" y="406" class="sans muted">Each item is a generic password: account = key name, data = the string. A save deletes the old item and adds a new one.</text>
</svg>
