<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Access token and refresh token lifetimes</title>
  <desc id="desc">Timeline from sign-in on day 0 to day 30. Access tokens last 15 minutes each and are replaced while the app is in use. The refresh token gets a new value at every refresh, but its expiry stays fixed at 30 days after sign-in. The app is closed overnight; the next morning the refresh token is still valid, so the app refreshes and continues. If the refresh token lived only 15 minutes, it would have expired overnight and the user would have to sign in again.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .row { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .rowsub { font-size: 11px; fill: #8b949e; }
      .day { font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .tick { font-size: 10.5px; fill: #8b949e; }
      .val { font-size: 10.5px; fill: #e6edf3; }
      .event { font-size: 11.5px; fill: #c9d1d9; }
      .muted { font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Day headings -->
  <g class="sans day" text-anchor="middle">
    <text x="300" y="34">Day 0</text>
    <text x="540" y="34">Day 1</text>
    <text x="698" y="34">Day 30</text>
  </g>

  <!-- Time ticks -->
  <g class="sans tick" text-anchor="middle">
    <text x="180" y="56">09:00</text>
    <text x="240" y="56">09:15</text>
    <text x="300" y="56">09:30</text>
    <text x="360" y="56">09:45</text>
    <text x="460" y="56">08:00</text>
    <text x="520" y="56">08:15</text>
    <text x="580" y="56">08:30</text>
    <text x="690" y="56">09:00</text>
  </g>

  <!-- Axis with scale breaks -->
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="180" y1="66" x2="420" y2="66"/>
    <line x1="460" y1="66" x2="620" y2="66"/>
    <line x1="660" y1="66" x2="736" y2="66"/>
    <g stroke-width="1">
      <line x1="180" y1="62" x2="180" y2="70"/><line x1="240" y1="62" x2="240" y2="70"/>
      <line x1="300" y1="62" x2="300" y2="70"/><line x1="360" y1="62" x2="360" y2="70"/>
      <line x1="420" y1="62" x2="420" y2="70"/><line x1="460" y1="62" x2="460" y2="70"/>
      <line x1="520" y1="62" x2="520" y2="70"/><line x1="580" y1="62" x2="580" y2="70"/>
      <line x1="690" y1="62" x2="690" y2="70"/>
    </g>
  </g>
  <g fill="none" stroke="#8b949e" stroke-width="1.5">
    <path d="M426,60 L432,72 M434,60 L440,72"/>
    <path d="M636,60 L642,72 M644,60 L650,72"/>
  </g>
  <text x="440" y="86" class="sans tick" text-anchor="middle">night</text>
  <text x="640" y="86" class="sans tick" text-anchor="middle">…</text>

  <!-- Event guide lines -->
  <g stroke="#8b949e" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4">
    <line x1="180" y1="92" x2="180" y2="292"/>
    <line x1="340" y1="92" x2="340" y2="292"/>
    <line x1="460" y1="92" x2="460" y2="292"/>
    <line x1="690" y1="92" x2="690" y2="292"/>
  </g>

  <!-- Row labels -->
  <g class="sans">
    <text x="24" y="118" class="row">Access token</text>
    <text x="24" y="134" class="rowsub">15 min each</text>
    <text x="24" y="178" class="row">Refresh token</text>
    <text x="24" y="194" class="rowsub">30 days from sign-in</text>
    <text x="24" y="248" class="row" style="fill:#ff7b72">If it lived 15 min</text>
    <text x="24" y="264" class="rowsub">like the access token</text>
  </g>

  <!-- Access tokens: one per 15 minutes while the app is used -->
  <g fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="1.2">
    <rect x="181" y="108" width="57" height="28" rx="4"/>
    <rect x="241" y="108" width="57" height="28" rx="4"/>
    <rect x="301" y="108" width="57" height="28" rx="4"/>
    <rect x="461" y="108" width="57" height="28" rx="4"/>
    <rect x="521" y="108" width="57" height="28" rx="4"/>
  </g>
  <text x="400" y="127" class="sans muted" text-anchor="middle">expired</text>
  <text x="600" y="127" class="sans muted" text-anchor="start">…</text>

  <!-- Refresh token: one session, value rotates, end is fixed -->
  <g fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.2">
    <rect x="181" y="168" width="57" height="28" rx="4"/>
    <rect x="241" y="168" width="57" height="28" rx="4"/>
    <rect x="301" y="168" width="119" height="28" rx="4"/>
    <rect x="461" y="168" width="57" height="28" rx="4"/>
    <rect x="521" y="168" width="99" height="28" rx="4"/>
    <rect x="660" y="168" width="30" height="28" rx="4"/>
  </g>
  <g stroke="#58a6ff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="420" y1="182" x2="460" y2="182"/>
    <line x1="620" y1="182" x2="660" y2="182"/>
  </g>
  <g class="mono val" text-anchor="middle">
    <text x="210" y="186">a1B2</text>
    <text x="270" y="186">x9Y8</text>
    <text x="360" y="186">k3L4</text>
    <text x="490" y="186">p7Q2</text>
    <text x="570" y="186">m5N6</text>
    <text x="675" y="186">…</text>
  </g>
  <!-- Fixed end -->
  <line x1="690" y1="160" x2="690" y2="204" stroke="#ff7b72" stroke-width="2.5"/>
  <text x="698" y="214" class="sans" font-size="11" fill="#ff7b72">expires</text>

  <!-- Refresh calls -->
  <g fill="#d2a8ff">
    <circle cx="240" cy="152" r="4.5"/>
    <circle cx="300" cy="152" r="4.5"/>
    <circle cx="460" cy="152" r="4.5"/>
    <circle cx="520" cy="152" r="4.5"/>
  </g>

  <!-- Hypothetical: 15-minute refresh token -->
  <g fill="#ff7b72" fill-opacity="0.15" stroke="#ff7b72" stroke-width="1.2">
    <rect x="181" y="238" width="57" height="28" rx="4"/>
    <rect x="241" y="238" width="57" height="28" rx="4"/>
    <rect x="301" y="238" width="57" height="28" rx="4"/>
  </g>
  <line x1="360" y1="230" x2="360" y2="274" stroke="#ff7b72" stroke-width="2.5"/>
  <circle cx="460" cy="252" r="9" fill="#161b22" stroke="#ff7b72"/>
  <path d="M455,247 L465,257 M465,247 L455,257" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <text x="476" y="250" class="sans" font-size="11.5" fill="#ff7b72">expired overnight:</text>
  <text x="476" y="265" class="sans" font-size="11.5" fill="#ff7b72">type the password again</text>

  <!-- Events -->
  <g class="sans event" text-anchor="middle">
    <text x="180" y="310">Sign in</text>
    <text x="340" y="310">App closed</text>
    <text x="460" y="310">App opened</text>
    <text x="690" y="310">Sign in again</text>
  </g>

  <!-- Legend -->
  <g class="sans">
    <circle cx="30" cy="350" r="4.5" fill="#d2a8ff"/>
    <text x="42" y="354" class="muted"><tspan class="mono" font-size="11" fill="#d2a8ff">POST /auth/refreshToken</tspan>: new access token and new refresh token value</text>
    <text x="42" y="370" class="muted">The 30-day end is set at sign-in. Refreshing changes the value, not the end date.</text>
  </g>
</svg>
