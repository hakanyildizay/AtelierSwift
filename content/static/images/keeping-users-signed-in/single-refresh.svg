<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="title desc">
  <title id="title">One refresh at a time</title>
  <desc id="desc">getDashboard and getUser both need a fresh token. getDashboard reaches the TokenRefreshCoordinator actor first and starts the refresh. getUser arrives while the refresh is still running, so it waits for the same task instead of sending a second refresh request. When the server returns the new token pair, both requests resume and are sent with the new access token.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7b72" fill-opacity="0.6"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .titlecode { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .label { font-size: 12.5px; fill: #c9d1d9; }
      .code { font-size: 12px; fill: #a5d6ff; }
      .note { font-size: 12px; fill: #c9d1d9; }
      .notecode { font-size: 11.5px; fill: #a5d6ff; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .wait { font-size: 11px; font-weight: 600; fill: #e3b341; letter-spacing: 0.5px; }
      .num { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="619" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Participants -->
  <g class="sans" text-anchor="middle">
    <rect x="30" y="24" width="140" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="100" y="46" class="mono titlecode">getDashboard()</text>
    <text x="100" y="64" class="sub">request A</text>

    <rect x="180" y="24" width="140" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="250" y="46" class="mono titlecode">getUser()</text>
    <text x="250" y="64" class="sub">request B</text>

    <rect x="350" y="24" width="180" height="52" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-opacity="0.8"/>
    <text x="440" y="46" class="title">Coordinator</text>
    <text x="440" y="64" class="sub">actor, one refresh at a time</text>

    <rect x="580" y="24" width="140" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="650" y="46" class="title">Server</text>
    <text x="650" y="64" class="sub">Nginx → services</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="76" x2="100" y2="580"/>
    <line x1="250" y1="76" x2="250" y2="580"/>
    <line x1="440" y1="76" x2="440" y2="580"/>
    <line x1="650" y1="76" x2="650" y2="580"/>
  </g>

  <!-- Waiting bars -->
  <rect x="94" y="110" width="12" height="340" rx="3" fill="#e3b341" fill-opacity="0.25" stroke="#e3b341" stroke-opacity="0.8"/>
  <text transform="translate(84 280) rotate(-90)" class="sans wait" text-anchor="middle">WAITING</text>
  <rect x="244" y="232" width="12" height="244" rx="3" fill="#e3b341" fill-opacity="0.25" stroke="#e3b341" stroke-opacity="0.8"/>
  <text transform="translate(234 354) rotate(-90)" class="sans wait" text-anchor="middle">WAITING</text>

  <!-- 1. A asks first -->
  <text x="345" y="102" class="mono code" text-anchor="middle">refreshIfNeeded()</text>
  <line x1="106" y1="110" x2="436" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="335" y="124" width="210" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="142" class="sans note" text-anchor="middle">No refresh running:</text>
  <text x="440" y="159" class="sans note" text-anchor="middle">start one, keep it in <tspan class="mono notecode">inFlight</tspan></text>

  <!-- 2. The one refresh request -->
  <text x="545" y="186" class="mono" font-size="12" fill="#d2a8ff" text-anchor="middle">POST /auth/refreshToken</text>
  <line x1="444" y1="196" x2="646" y2="196" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 3. B asks while it's running -->
  <text x="345" y="224" class="mono code" text-anchor="middle">refreshIfNeeded()</text>
  <line x1="256" y1="232" x2="436" y2="232" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="335" y="246" width="210" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="264" class="sans note" text-anchor="middle">Refresh already running:</text>
  <text x="440" y="281" class="mono notecode" text-anchor="middle">await inFlight.value</text>

  <!-- Second refresh: never sent -->
  <text x="545" y="306" class="sans" font-size="12" fill="#ff7b72" text-anchor="middle">no second refresh is sent</text>
  <line x1="444" y1="324" x2="646" y2="324" stroke="#ff7b72" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow-red)"/>
  <circle cx="545" cy="324" r="9" fill="#161b22" stroke="#ff7b72"/>
  <path d="M540,319 L550,329 M550,319 L540,329" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>

  <!-- 4. Server answers -->
  <text x="545" y="362" class="sans label" text-anchor="middle" style="fill:#3fb950">200 · new token pair</text>
  <line x1="650" y1="372" x2="444" y2="372" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <rect x="335" y="386" width="210" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="404" class="sans note" text-anchor="middle">Save tokens to the Keychain,</text>
  <text x="440" y="421" class="sans note" text-anchor="middle">clear <tspan class="mono notecode">inFlight</tspan></text>

  <!-- 5. Both resume -->
  <text x="345" y="444" class="sans muted" text-anchor="middle">both resume</text>
  <line x1="436" y1="450" x2="108" y2="450" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <line x1="436" y1="476" x2="258" y2="476" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>

  <!-- 6. Real requests with the new token -->
  <text x="545" y="506" class="sans label" text-anchor="middle">with <tspan class="mono code">Bearer &lt;new token&gt;</tspan></text>
  <text x="175" y="508" class="mono code" text-anchor="middle">GET dashboard</text>
  <line x1="104" y1="516" x2="646" y2="516" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="345" y="540" class="mono code" text-anchor="middle">GET /api/user</text>
  <line x1="254" y1="548" x2="646" y2="548" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step numbers -->
  <g class="sans" text-anchor="middle">
    <circle cx="100" cy="110" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="114" class="num">1</text>
    <circle cx="440" cy="196" r="10" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="440" y="200" class="num">2</text>
    <circle cx="250" cy="232" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="250" y="236" class="num">3</text>
    <circle cx="650" cy="372" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="650" y="376" class="num">4</text>
    <circle cx="440" cy="450" r="10" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <text x="440" y="454" class="num">5</text>
    <circle cx="100" cy="516" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="520" class="num">6</text>
  </g>

  <!-- Legend -->
  <rect x="30" y="592" width="10" height="12" rx="2" fill="#e3b341" fill-opacity="0.25" stroke="#e3b341" stroke-opacity="0.8"/>
  <text x="48" y="602" class="sans muted">request is suspended, waiting for the refresh to finish</text>
</svg>
