<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title desc">
  <title id="title">A key rotation in four phases</title>
  <desc id="desc">Phase 1, Add: the new key is in the keyring and published in the JWKS, the old key still signs. Phase 2, Switch: the new key signs, the old key only verifies. Phase 3, Wait at least 15 minutes: tokens signed with the old key expire. Phase 4, Remove: only the new key is left in the keyring and the JWKS. Phases 1, 2 and 4 each start with a restart of AuthService. Refresh tokens are not signed with these keys, so nobody is signed out.</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e3b341" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#e3b341" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .phase { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .psub { font-size: 10.5px; fill: #8b949e; }
      .row { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .rowsub { font-size: 10.5px; fill: #a5d6ff; }
      .bar { font-size: 11px; font-weight: 600; }
      .barcode { font-size: 10.5px; fill: #a5d6ff; }
      .small { font-size: 10px; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .num { font-size: 10.5px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Phase headers -->
  <g class="sans">
    <circle cx="212" cy="34" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="212" y="38" class="num" text-anchor="middle">1</text>
    <text x="226" y="39" class="phase">Add</text>
    <text x="204" y="62" class="psub">new key in the ring</text>

    <circle cx="342" cy="34" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="342" y="38" class="num" text-anchor="middle">2</text>
    <text x="356" y="39" class="phase">Switch</text>
    <text x="334" y="62" class="psub">active kid = new key</text>

    <circle cx="472" cy="34" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="472" y="38" class="num" text-anchor="middle">3</text>
    <text x="486" y="39" class="phase">Wait ≥ 15 min</text>
    <text x="464" y="62" class="psub">old tokens expire</text>

    <circle cx="612" cy="34" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="612" y="38" class="num" text-anchor="middle">4</text>
    <text x="626" y="39" class="phase">Remove</text>
    <text x="604" y="62" class="psub">old key out of the ring</text>
  </g>

  <!-- Phase boundaries -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="200" y1="76" x2="200" y2="334"/>
    <line x1="330" y1="76" x2="330" y2="334"/>
    <line x1="460" y1="76" x2="460" y2="334"/>
    <line x1="600" y1="76" x2="600" y2="334"/>
    <line x1="736" y1="76" x2="736" y2="334"/>
  </g>

  <!-- Row labels -->
  <g class="sans">
    <text x="24" y="114" class="row">Old key</text>
    <text x="24" y="129" class="mono rowsub">key-2026-09-13</text>
    <text x="24" y="174" class="row">New key</text>
    <text x="24" y="189" class="mono rowsub">key-2026-10-22</text>
    <text x="24" y="234" class="row">JWKS lists</text>
    <text x="24" y="249" class="psub">what verifiers fetch</text>
    <text x="24" y="294" class="row">Access tokens</text>
    <text x="24" y="309" class="psub">in use, 15 min each</text>
  </g>

  <!-- Old key -->
  <rect x="202" y="104" width="126" height="26" rx="5" fill="#e3b341" fill-opacity="0.3" stroke="#e3b341"/>
  <text x="265" y="121" class="sans bar" fill="#e3b341" text-anchor="middle">signs</text>
  <rect x="332" y="104" width="266" height="26" rx="5" fill="#e3b341" fill-opacity="0.06" stroke="#e3b341" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <text x="465" y="121" class="sans bar" fill="#e3b341" fill-opacity="0.85" text-anchor="middle">verifies only</text>
  <text x="668" y="121" class="sans small" fill="#ff7b72" text-anchor="middle">removed</text>

  <!-- New key -->
  <rect x="202" y="164" width="126" height="26" rx="5" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff" stroke-opacity="0.8" stroke-dasharray="4 3"/>
  <text x="265" y="181" class="sans bar" fill="#58a6ff" text-anchor="middle">published only</text>
  <rect x="332" y="164" width="402" height="26" rx="5" fill="#e3b341" fill-opacity="0.3" stroke="#e3b341"/>
  <text x="533" y="181" class="sans bar" fill="#e3b341" text-anchor="middle">signs</text>

  <!-- JWKS -->
  <rect x="202" y="224" width="396" height="26" rx="5" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="400" y="241" class="mono barcode" text-anchor="middle">key-2026-09-13 + key-2026-10-22</text>
  <rect x="602" y="224" width="132" height="26" rx="5" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="668" y="241" class="mono barcode" text-anchor="middle">key-2026-10-22</text>

  <!-- Tokens -->
  <rect x="202" y="284" width="396" height="16" rx="4" fill="url(#fade)"/>
  <text x="210" y="296" class="sans small" fill="#e6edf3">signed with the old key</text>
  <rect x="332" y="306" width="402" height="16" rx="4" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="340" y="318" class="sans small" fill="#e6edf3">signed with the new key</text>

  <!-- Restart markers -->
  <g class="sans small" fill="#d2a8ff" text-anchor="middle">
    <circle cx="200" cy="334" r="4" fill="#d2a8ff"/>
    <text x="200" y="352">restart</text>
    <circle cx="330" cy="334" r="4" fill="#d2a8ff"/>
    <text x="330" y="352">restart</text>
    <circle cx="600" cy="334" r="4" fill="#d2a8ff"/>
    <text x="600" y="352">restart</text>
  </g>
  <text x="24" y="352" class="sans small" fill="#d2a8ff">AuthService</text>

  <!-- Footer -->
  <line x1="24" y1="374" x2="736" y2="374" stroke="#30363d"/>
  <text x="24" y="398" class="sans muted">Refresh tokens are random strings stored in the database, not signed with these keys,</text>
  <text x="24" y="416" class="sans muted">so a rotation doesn't sign anyone out.</text>
</svg>
