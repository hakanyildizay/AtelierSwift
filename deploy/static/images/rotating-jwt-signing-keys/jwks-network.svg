<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Where the JWKS endpoint is reachable</title>
  <desc id="desc">The iOS app reaches the services only through the Nginx gateway on port 8080, which forwards /api/auth/ and /api/user/ to AuthService, /api/workouts/ to WorkoutEngine and /api/notifications/ to NotificationService. There is no route for /.well-known/jwks.json. Inside the private network, WorkoutEngine fetches /.well-known/jwks.json from AuthService directly, using AUTH_HOST and AUTH_PORT.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .route { font-size: 11px; fill: #a5d6ff; }
      .target { font-size: 11px; fill: #8b949e; }
      .label { font-size: 11px; }
      .muted { font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="419" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Internet label -->
  <text x="76" y="44" class="sans sub" text-anchor="middle">Internet</text>

  <!-- iOS app -->
  <rect x="24" y="136" width="104" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="76" y="159" class="sans title" text-anchor="middle">iOS app</text>
  <text x="76" y="176" class="sans sub" text-anchor="middle">bearer token</text>
  <line x1="128" y1="162" x2="186" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="157" y="152" class="mono label" fill="#8b949e" text-anchor="middle">/api/…</text>

  <!-- Gateway -->
  <rect x="190" y="60" width="236" height="214" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="206" y="84" class="sans title">Nginx gateway</text>
  <text x="206" y="100" class="sans sub">:8080 · the only public entry point</text>

  <g class="mono">
    <text x="206" y="128" class="route">/api/auth/</text>
    <text x="410" y="128" class="target" text-anchor="end">→ Auth</text>
    <text x="206" y="152" class="route">/api/user/</text>
    <text x="410" y="152" class="target" text-anchor="end">→ Auth</text>
    <text x="206" y="176" class="route">/api/workouts/</text>
    <text x="410" y="176" class="target" text-anchor="end">→ Workout</text>
    <text x="206" y="200" class="route">/api/notifications/</text>
    <text x="410" y="200" class="target" text-anchor="end">→ Notif.</text>
  </g>
  <line x1="206" y1="214" x2="410" y2="214" stroke="#30363d"/>
  <rect x="202" y="224" width="212" height="36" rx="6" fill="#ff7b72" fill-opacity="0.08" stroke="#ff7b72" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text x="212" y="241" class="mono route" style="fill:#ff7b72">/.well-known/jwks.json</text>
  <text x="212" y="254" class="sans sub" style="fill:#ff7b72">✗ no route</text>

  <!-- Private network -->
  <rect x="456" y="24" width="280" height="330" rx="10" fill="none" stroke="#3fb950" stroke-opacity="0.6" stroke-dasharray="6 4"/>
  <text x="472" y="44" class="sans sub" style="fill:#3fb950">Private network</text>

  <!-- AuthService -->
  <rect x="496" y="58" width="224" height="92" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="512" y="80" class="sans title">AuthService</text>
  <text x="704" y="80" class="mono sub" text-anchor="end">:8081</text>
  <rect x="512" y="94" width="192" height="24" rx="5" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="608" y="110" class="mono route" text-anchor="middle">/.well-known/jwks.json</text>
  <text x="512" y="138" class="sans sub">/api/auth/…, /api/user/…</text>

  <!-- WorkoutEngine -->
  <rect x="496" y="212" width="224" height="56" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="512" y="236" class="sans title">WorkoutEngine</text>
  <text x="704" y="236" class="mono sub" text-anchor="end">:8082</text>
  <text x="512" y="254" class="sans sub">JWKSVerifier, public keys only</text>

  <!-- NotificationService -->
  <rect x="496" y="286" width="224" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="512" y="310" class="sans title">NotificationService</text>
  <text x="704" y="310" class="mono sub" text-anchor="end">:8083</text>
  <text x="512" y="327" class="sans sub">/api/notifications/…</text>

  <!-- Gateway → services -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M426,140 L492,124" marker-end="url(#arrow-gray)"/>
    <path d="M426,172 L492,236" marker-end="url(#arrow-gray)"/>
    <path d="M426,196 L492,306" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- WorkoutEngine → JWKS -->
  <line x1="680" y1="212" x2="680" y2="122" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="672" y="172" class="mono label" fill="#58a6ff" text-anchor="end">GET /.well-known/jwks.json</text>
  <text x="672" y="188" class="mono label" fill="#8b949e" text-anchor="end">AUTH_HOST:AUTH_PORT</text>

  <!-- Footer -->
  <line x1="24" y1="374" x2="736" y2="374" stroke="#30363d"/>
  <text x="24" y="398" class="sans muted">From outside, the JWKS URL doesn't exist. Only the services that verify tokens fetch it, directly from AuthService.</text>
</svg>
