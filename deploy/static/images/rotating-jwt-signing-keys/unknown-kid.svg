<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
  <title id="title">A verifier meets an unknown kid</title>
  <desc id="desc">The iOS app calls WorkoutEngine with an access token signed with the new key key-2026-10-22. WorkoutEngine's cached JWKS only has key-2026-09-13, so it fetches /.well-known/jwks.json from AuthService once, gets both keys, verifies the signature with the new key and answers 200. The unknown-kid refetch happens at most once every 15 seconds; otherwise the cache is refreshed when it is older than 5 minutes.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .label { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .code { font-size: 11.5px; fill: #a5d6ff; }
      .note { font-size: 12px; fill: #c9d1d9; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .num { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="479" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Participants -->
  <g class="sans" text-anchor="middle">
    <rect x="35" y="24" width="150" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="110" y="45" class="title">iOS app</text>
    <text x="110" y="62" class="sub">has a new token</text>

    <rect x="290" y="24" width="180" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="380" y="45" class="title">WorkoutEngine</text>
    <text x="380" y="62" class="sub">JWKSVerifier, public keys only</text>

    <rect x="575" y="24" width="150" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="650" y="45" class="title">AuthService</text>
    <text x="650" y="62" class="sub">now signs with the new key</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="110" y1="72" x2="110" y2="412"/>
    <line x1="380" y1="72" x2="380" y2="412"/>
    <line x1="650" y1="72" x2="650" y2="412"/>
  </g>

  <!-- 1. Request with new token -->
  <text x="245" y="100" class="sans label" text-anchor="middle">GET /api/workouts/…</text>
  <text x="245" y="117" class="mono code" text-anchor="middle">kid: <tspan fill="#e3b341">key-2026-10-22</tspan></text>
  <line x1="121" y1="130" x2="376" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 2. Cache miss -->
  <rect x="262" y="148" width="236" height="50" rx="6" fill="#21262d" stroke="#e3b341" stroke-opacity="0.7"/>
  <text x="380" y="168" class="sans note" text-anchor="middle">Cache has only <tspan class="mono code">key-2026-09-13</tspan></text>
  <text x="380" y="186" class="sans note" text-anchor="middle" style="fill:#e3b341">unknown kid → refresh once</text>

  <!-- 3. Fetch JWKS -->
  <text x="515" y="227" class="mono code" text-anchor="middle">GET /.well-known/jwks.json</text>
  <line x1="391" y1="238" x2="646" y2="238" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 4. Keys back -->
  <text x="515" y="270" class="sans note" text-anchor="middle" style="fill:#3fb950">200 · both public keys</text>
  <text x="515" y="286" class="mono code" text-anchor="middle">key-2026-09-13, key-2026-10-22</text>
  <line x1="650" y1="298" x2="384" y2="298" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- 5. Verified -->
  <rect x="262" y="316" width="236" height="50" rx="6" fill="#21262d" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="380" y="336" class="sans note" text-anchor="middle">Cache updated, signature checked</text>
  <text x="380" y="354" class="sans note" text-anchor="middle">with <tspan class="mono code" fill="#e3b341" style="fill:#e3b341">key-2026-10-22</tspan> ✓</text>

  <!-- 6. Response -->
  <text x="245" y="384" class="sans label" text-anchor="middle" style="fill:#3fb950">200 OK</text>
  <line x1="369" y1="396" x2="114" y2="396" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- Step numbers -->
  <g class="sans" text-anchor="middle">
    <circle cx="110" cy="130" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="110" y="134" class="num">1</text>
    <circle cx="262" cy="173" r="10" fill="#0d1117" stroke="#e3b341" stroke-width="1.5"/>
    <text x="262" y="177" class="num">2</text>
    <circle cx="380" cy="238" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="380" y="242" class="num">3</text>
    <circle cx="650" cy="298" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="650" y="302" class="num">4</text>
    <circle cx="262" cy="341" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="262" y="345" class="num">5</text>
    <circle cx="380" cy="396" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="380" y="400" class="num">6</text>
  </g>

  <!-- Footer -->
  <line x1="24" y1="426" x2="736" y2="426" stroke="#30363d"/>
  <text x="24" y="448" class="sans muted">Refetch on an unknown kid: at most once every 15 seconds.</text>
  <text x="24" y="466" class="sans muted">Without one, the cache is refreshed when a request arrives and it is older than 5 minutes.</text>
</svg>
