<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 846" width="760" height="846" role="img" aria-labelledby="title desc">
  <title id="title">When a token is signed and when it is verified</title>
  <desc id="desc">Signing happens once per login or refresh: the iOS app calls AuthService, which looks up the user and stores a refresh token hash in the database, builds a UserPayload, encodes header and payload as the string base64url(header).base64url(payload), signs that string with the active private key and returns header.payload.signature. Verifying happens on every request: the app sends the token to WorkoutEngine, which takes the token from the Authorization header, reads the kid from the header, finds the public key in its cached JWKS, checks the signature over header.payload and checks that exp is still ahead. Verification calls neither AuthService nor the database. WorkoutEngine then answers 200 or 401.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .band { font-size: 12px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .step { font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .code { font-size: 11px; fill: #a5d6ff; }
      .note { font-size: 11.5px; fill: #c9d1d9; }
      .small { font-size: 10.5px; fill: #8b949e; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .num { font-size: 10.5px; font-weight: 700; fill: #e6edf3; }
      .no { font-size: 11px; font-weight: 600; fill: #ff7b72; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="845" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Participants -->
  <g class="sans" text-anchor="middle">
    <rect x="25" y="20" width="130" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="40" class="title">iOS app</text>
    <text x="90" y="56" class="sub">stores the token</text>

    <rect x="235" y="20" width="130" height="44" rx="8" fill="#21262d" stroke="#e3b341" stroke-opacity="0.7"/>
    <text x="300" y="40" class="title">AuthService</text>
    <text x="300" y="56" class="sub">private keys · signs</text>

    <rect x="450" y="20" width="140" height="44" rx="8" fill="#21262d" stroke="#58a6ff" stroke-opacity="0.7"/>
    <text x="520" y="40" class="title">WorkoutEngine</text>
    <text x="520" y="56" class="sub">public keys · verifies</text>

    <path d="M650,26 a40,7 0 0 0 80,0 a40,7 0 0 0 -80,0 v32 a40,7 0 0 0 80,0 v-32" fill="#21262d" stroke="#8b949e" stroke-opacity="0.8"/>
    <text x="690" y="50" class="title">Database</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="90" y1="64" x2="90" y2="768"/>
    <line x1="300" y1="64" x2="300" y2="768"/>
    <line x1="520" y1="64" x2="520" y2="768"/>
    <line x1="690" y1="66" x2="690" y2="768"/>
  </g>

  <!-- ===== Signing ===== -->
  <rect x="16" y="76" width="728" height="22" rx="5" fill="#161b22"/>
  <rect x="16" y="76" width="728" height="22" rx="5" fill="#e3b341" fill-opacity="0.08"/>
  <text x="26" y="91" class="sans band" fill="#e3b341">SIGN · once per login or refresh</text>

  <text x="195" y="118" class="mono code" text-anchor="middle">POST /api/auth/login</text>
  <line x1="94" y1="128" x2="296" y2="128" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <text x="495" y="140" class="sans small" text-anchor="middle">find the user, store the refresh token hash</text>
  <line x1="304" y1="150" x2="686" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="150" y="166" width="300" height="134" rx="6" fill="#21262d" stroke="#e3b341" stroke-opacity="0.7"/>
  <g class="sans">
    <circle cx="170" cy="185" r="9" fill="#0d1117" stroke="#e3b341" stroke-width="1.3"/>
    <text x="170" y="189" class="num" text-anchor="middle">1</text>
    <text x="186" y="189" class="step">Build the <tspan class="mono code" style="font-size:12px">UserPayload</tspan></text>
    <text x="186" y="205" class="note">sub, userId, role, iat, exp = now + 15 min</text>

    <circle cx="170" cy="228" r="9" fill="#0d1117" stroke="#e3b341" stroke-width="1.3"/>
    <text x="170" y="232" class="num" text-anchor="middle">2</text>
    <text x="186" y="232" class="step">Turn it into a string</text>
    <text x="186" y="248" class="mono code">base64url(header).base64url(payload)</text>

    <circle cx="170" cy="271" r="9" fill="#0d1117" stroke="#e3b341" stroke-width="1.3"/>
    <text x="170" y="275" class="num" text-anchor="middle">3</text>
    <text x="186" y="275" class="step">🔒 Sign that string</text>
    <text x="186" y="291" class="note">ES256 with the <tspan style="fill:#e3b341">active private key</tspan></text>
  </g>

  <text x="195" y="320" class="sans label" text-anchor="middle" style="fill:#3fb950">accessToken</text>
  <text x="195" y="335" class="mono code" text-anchor="middle">header.payload.<tspan style="fill:#e3b341">signature</tspan></text>
  <line x1="296" y1="346" x2="94" y2="346" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- ===== Verifying ===== -->
  <rect x="16" y="364" width="728" height="22" rx="5" fill="#161b22"/>
  <rect x="16" y="364" width="728" height="22" rx="5" fill="#58a6ff" fill-opacity="0.08"/>
  <text x="26" y="379" class="sans band" fill="#58a6ff">VERIFY · on every request that needs a user</text>

  <text x="305" y="406" class="mono code" text-anchor="middle">GET /api/workouts/video/:id</text>
  <text x="305" y="421" class="mono code" text-anchor="middle" style="fill:#8b949e">Authorization: Bearer &lt;accessToken&gt;</text>
  <line x1="94" y1="432" x2="516" y2="432" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="300" y="446" width="380" height="250" rx="6" fill="#21262d" stroke="#58a6ff" stroke-opacity="0.7"/>
  <g class="sans">
    <text x="316" y="466" class="small">One call runs all five steps:</text>
    <text x="316" y="484" class="mono code" style="fill:#e3b341">req.jwt.verify(as: UserPayload.self)</text>
    <text x="664" y="484" class="small" text-anchor="end">AuthService</text>
    <text x="316" y="501" class="mono code" style="fill:#e3b341">keys.verify(token, as: UserPayload.self)</text>
    <text x="664" y="501" class="small" text-anchor="end">WorkoutEngine</text>
    <line x1="316" y1="513" x2="664" y2="513" stroke="#30363d"/>

    <circle cx="324" cy="533" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="324" y="537" class="num" text-anchor="middle">1</text>
    <text x="340" y="537" class="step">Take the token from the request</text>
    <text x="340" y="552" class="mono code">Authorization: Bearer &lt;token&gt;</text>

    <circle cx="324" cy="567" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="324" y="571" class="num" text-anchor="middle">2</text>
    <text x="340" y="571" class="step">Read the header</text>
    <text x="340" y="586" class="mono code">{ "alg": "ES256", "kid": "…" }</text>

    <circle cx="324" cy="601" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="324" y="605" class="num" text-anchor="middle">3</text>
    <text x="340" y="605" class="step">Find the public key by <tspan class="mono code" style="font-size:12px">kid</tspan></text>
    <text x="340" y="620" class="note">in the cached JWKS, in memory</text>

    <circle cx="324" cy="635" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="324" y="639" class="num" text-anchor="middle">4</text>
    <text x="340" y="639" class="step">🔑 Check the signature</text>
    <text x="340" y="654" class="note">over <tspan class="mono code">header.payload</tspan>, with the public key</text>

    <circle cx="324" cy="669" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="324" y="673" class="num" text-anchor="middle">5</text>
    <text x="340" y="673" class="step">Check the claims</text>
    <text x="340" y="688" class="note"><tspan class="mono code">exp</tspan> still ahead → <tspan class="mono code">UserPayload</tspan> (userId, role)</text>
  </g>

  <!-- Not needed -->
  <g class="sans">
    <line x1="516" y1="720" x2="304" y2="720" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.8"/>
    <circle cx="410" cy="720" r="9" fill="#161b22" stroke="#ff7b72" stroke-width="1.3"/>
    <text x="410" y="724" class="no" text-anchor="middle">✗</text>
    <text x="410" y="742" class="no" text-anchor="middle">no per-request call to AuthService</text>

    <line x1="524" y1="720" x2="686" y2="720" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.8"/>
    <circle cx="605" cy="720" r="9" fill="#161b22" stroke="#ff7b72" stroke-width="1.3"/>
    <text x="605" y="724" class="no" text-anchor="middle">✗</text>
    <text x="605" y="742" class="no" text-anchor="middle">no database query</text>
  </g>

  <text x="195" y="748" class="sans label" text-anchor="middle" style="fill:#3fb950">200 OK <tspan style="fill:#8b949e;font-weight:400">or</tspan> <tspan style="fill:#ff7b72">401</tspan></text>
  <line x1="516" y1="760" x2="94" y2="760" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- Footer -->
  <line x1="24" y1="784" x2="736" y2="784" stroke="#30363d"/>
  <text x="24" y="808" class="sans muted">Signing needs the private key and the database, but happens only once per login or refresh.</text>
  <text x="24" y="826" class="sans muted">Verifying needs only a public key that is already in memory, so it is cheap enough for every request.</text>
</svg>
