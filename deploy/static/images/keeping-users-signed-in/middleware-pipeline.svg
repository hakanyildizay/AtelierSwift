<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Client middleware pipeline</title>
  <desc id="desc">A call such as getDashboard goes from the app code to the generated Client, which builds an HTTP request. The request passes through AuthTokenMiddleware, then URLSessionTransport, then reaches the server. The response travels back the same way. Inside the middleware: refresh the access token if it expires within 60 seconds, attach it as a Bearer header, call next to continue the pipeline, and return the response unchanged.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #8b949e; }
      .subcode { font-size: 10.5px; fill: #a5d6ff; }
      .lane { font-size: 11.5px; fill: #8b949e; }
      .head { font-size: 13.5px; font-weight: 600; fill: #ffa657; }
      .code { font-size: 12px; fill: #a5d6ff; }
      .note { font-size: 12px; fill: #c9d1d9; }
      .muted { font-size: 11.5px; fill: #8b949e; }
      .num { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="659" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Pipeline stages -->
  <g class="sans" text-anchor="middle">
    <rect x="24" y="24" width="118" height="76" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="83" y="47" class="title">Your code</text>
    <text x="83" y="66" class="mono subcode">try await client</text>
    <text x="83" y="81" class="mono subcode">.getDashboard()</text>

    <rect x="160" y="24" width="118" height="76" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="219" y="47" class="title">Client</text>
    <text x="219" y="66" class="sub">generated from</text>
    <text x="219" y="81" class="sub">openapi.yaml</text>

    <rect x="295" y="24" width="170" height="76" rx="8" fill="#ffa657" fill-opacity="0.08" stroke="#ffa657" stroke-width="1.5"/>
    <text x="380" y="47" class="title">AuthTokenMiddleware</text>
    <text x="380" y="66" class="sub">your code, called by</text>
    <text x="380" y="81" class="sub">the Client on every request</text>

    <rect x="482" y="24" width="118" height="76" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="541" y="47" class="title">Transport</text>
    <text x="541" y="66" class="sub">URLSession</text>
    <text x="541" y="81" class="sub">sends the bytes</text>

    <rect x="618" y="24" width="118" height="76" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="677" y="47" class="title">Server</text>
    <text x="677" y="66" class="sub">Nginx gateway</text>
    <text x="677" y="81" class="sub">→ Vapor service</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="83" y1="100" x2="83" y2="212"/>
    <line x1="219" y1="100" x2="219" y2="212"/>
    <line x1="541" y1="100" x2="541" y2="212"/>
    <line x1="677" y1="100" x2="677" y2="212"/>
  </g>
  <line x1="380" y1="100" x2="380" y2="244" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Request: left to right -->
  <g class="sans lane" text-anchor="middle">
    <text x="151" y="132">typed input</text>
    <text x="300" y="132">HTTPRequest</text>
    <text x="460" y="132">+ Bearer token</text>
    <text x="609" y="132">HTTP</text>
  </g>
  <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)">
    <line x1="85" y1="142" x2="215" y2="142"/>
    <line x1="221" y1="142" x2="376" y2="142"/>
    <line x1="384" y1="142" x2="537" y2="142"/>
    <line x1="543" y1="142" x2="673" y2="142"/>
  </g>
  <text x="24" y="121" class="sans" font-size="11" font-weight="600" fill="#58a6ff">REQUEST →</text>

  <!-- Response: right to left -->
  <g class="sans lane" text-anchor="middle">
    <text x="609" y="178">HTTP</text>
    <text x="460" y="178">HTTPResponse</text>
    <text x="300" y="178">HTTPResponse</text>
    <text x="151" y="178">typed output</text>
  </g>
  <g stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <line x1="675" y1="188" x2="545" y2="188"/>
    <line x1="539" y1="188" x2="384" y2="188"/>
    <line x1="378" y1="188" x2="223" y2="188"/>
    <line x1="217" y1="188" x2="87" y2="188"/>
  </g>
  <text x="736" y="210" class="sans" font-size="11" font-weight="600" fill="#3fb950" text-anchor="end">← RESPONSE</text>

  <!-- Zoom panel -->
  <rect x="24" y="244" width="712" height="396" rx="10" fill="#ffa657" fill-opacity="0.04" stroke="#ffa657" stroke-opacity="0.7" stroke-dasharray="5 4"/>
  <text x="44" y="272" class="sans head">Inside AuthTokenMiddleware.intercept(…)</text>

  <!-- 1. Refresh if needed -->
  <rect x="60" y="292" width="380" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="250" y="317" class="mono code" text-anchor="middle">await coordinator.refreshIfNeeded()</text>
  <line x1="250" y1="332" x2="250" y2="354" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Decision -->
  <path d="M250,358 L400,396 L250,434 L100,396 Z" fill="#21262d" stroke="#30363d"/>
  <text x="250" y="392" class="sans note" text-anchor="middle">Access token expires</text>
  <text x="250" y="409" class="sans note" text-anchor="middle">within 60 seconds?</text>

  <!-- Yes branch: refresh -->
  <line x1="400" y1="396" x2="476" y2="396" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="436" y="388" class="sans muted" text-anchor="middle">yes</text>
  <rect x="480" y="352" width="240" height="96" rx="6" fill="#d2a8ff" fill-opacity="0.07" stroke="#d2a8ff" stroke-opacity="0.7"/>
  <text x="600" y="375" class="mono" font-size="12" fill="#d2a8ff" text-anchor="middle">POST /auth/refreshToken</text>
  <text x="600" y="395" class="sans note" text-anchor="middle">on a bare client, no middleware</text>
  <text x="600" y="413" class="sans note" text-anchor="middle">new token pair → Keychain</text>
  <text x="600" y="434" class="sans muted" text-anchor="middle">other requests wait for this one</text>
  <path d="M600,448 L600,480 L444,480" fill="none" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- No branch -->
  <line x1="250" y1="434" x2="250" y2="456" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="262" y="450" class="sans muted">no</text>

  <!-- 2. Attach the token -->
  <rect x="60" y="460" width="380" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="250" y="485" class="mono code" text-anchor="middle">Authorization: Bearer &lt;access token&gt;</text>
  <line x1="250" y1="500" x2="250" y2="518" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- 3. Pass it on -->
  <rect x="60" y="522" width="380" height="40" rx="6" fill="#21262d" stroke="#58a6ff" stroke-opacity="0.8"/>
  <text x="250" y="547" class="mono code" text-anchor="middle">try await next(request, body, baseURL)</text>
  <line x1="440" y1="542" x2="476" y2="542" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="484" y="538" class="sans note">continues to the Transport</text>
  <text x="484" y="555" class="sans muted">and waits for the response</text>
  <line x1="250" y1="562" x2="250" y2="580" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- 4. Return -->
  <rect x="60" y="584" width="380" height="36" rx="6" fill="#21262d" stroke="#3fb950" stroke-opacity="0.8"/>
  <text x="250" y="607" class="sans note" text-anchor="middle">return the response unchanged</text>

  <!-- Step numbers -->
  <g class="sans" text-anchor="middle">
    <circle cx="60" cy="312" r="10" fill="#0d1117" stroke="#ffa657" stroke-width="1.5"/>
    <text x="60" y="316" class="num">1</text>
    <circle cx="60" cy="480" r="10" fill="#0d1117" stroke="#ffa657" stroke-width="1.5"/>
    <text x="60" y="484" class="num">2</text>
    <circle cx="60" cy="542" r="10" fill="#0d1117" stroke="#ffa657" stroke-width="1.5"/>
    <text x="60" y="546" class="num">3</text>
    <circle cx="60" cy="602" r="10" fill="#0d1117" stroke="#ffa657" stroke-width="1.5"/>
    <text x="60" y="606" class="num">4</text>
  </g>
</svg>
