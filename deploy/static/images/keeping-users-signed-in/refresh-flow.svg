<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Refresh token flow</title>
  <desc id="desc">The iOS app sends its refresh token to AuthService. AuthService hashes it, finds the matching row in PostgreSQL, signs a new access token, creates a new refresh token, replaces the stored hash and returns both tokens. If the token is unknown or expired, it answers 401 and the app signs out.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 11.5px; fill: #8b949e; }
      .label { font-size: 13.5px; font-weight: 600; fill: #e6edf3; }
      .note { font-size: 12.5px; fill: #c9d1d9; }
      .code { font-size: 12px; fill: #a5d6ff; }
      .muted { font-size: 12.5px; fill: #8b949e; }
      .num { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="759" height="609" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Participants -->
  <g class="sans" text-anchor="middle">
    <rect x="35" y="24" width="150" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="110" y="45" class="title">iOS app</text>
    <text x="110" y="62" class="sub">SwiftUI</text>

    <rect x="305" y="24" width="150" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="380" y="45" class="title">AuthService</text>
    <text x="380" y="62" class="sub">Vapor</text>

    <rect x="575" y="24" width="150" height="48" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="650" y="45" class="title">PostgreSQL</text>
    <text x="650" y="62" class="sub">user_tokens table</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="110" y1="72" x2="110" y2="592"/>
    <line x1="380" y1="72" x2="380" y2="592"/>
    <line x1="650" y1="72" x2="650" y2="592"/>
  </g>

  <!-- 1. App sends the refresh token -->
  <text x="245" y="102" class="sans label" text-anchor="middle">POST /auth/refreshToken</text>
  <text x="245" y="119" class="mono code" text-anchor="middle">{ refreshToken: "a1B2…" }</text>
  <line x1="121" y1="132" x2="376" y2="132" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 2. Hash it -->
  <rect x="270" y="158" width="220" height="34" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="385" y="180" class="mono code" text-anchor="middle">hash = SHA-256("a1B2…")</text>

  <!-- 3. Look up the row -->
  <text x="515" y="223" class="mono code" text-anchor="middle">find row by token_hash</text>
  <line x1="391" y1="236" x2="646" y2="236" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 4. Row comes back -->
  <text x="515" y="266" class="sans muted" text-anchor="middle">row found, not expired</text>
  <line x1="650" y1="278" x2="384" y2="278" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>

  <!-- 5. New tokens -->
  <rect x="225" y="300" width="310" height="56" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="385" y="323" class="sans note" text-anchor="middle">Sign a new access token (ES256, 15 min)</text>
  <text x="385" y="343" class="sans note" text-anchor="middle">Create a new refresh token <tspan class="mono code">"x9Y8…"</tspan></text>

  <!-- 6. Replace the stored hash -->
  <text x="515" y="385" class="mono code" text-anchor="middle">token_hash = SHA-256("x9Y8…")</text>
  <line x1="391" y1="398" x2="646" y2="398" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="515" y="418" class="sans" font-size="12" fill="#ff7b72" text-anchor="middle">"a1B2…" stops working here</text>

  <!-- 7. Response -->
  <text x="245" y="446" class="sans label" fill="#3fb950" text-anchor="middle" style="fill:#3fb950">200 OK</text>
  <text x="245" y="464" class="mono code" text-anchor="middle">{ accessToken, expireDate,</text>
  <text x="245" y="480" class="mono code" text-anchor="middle">  refreshToken: "x9Y8…" }</text>
  <line x1="369" y1="494" x2="114" y2="494" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- Failure path -->
  <rect x="24" y="518" width="712" height="66" rx="8" fill="#ff7b72" fill-opacity="0.06" stroke="#ff7b72" stroke-opacity="0.6" stroke-dasharray="5 4"/>
  <text x="724" y="543" class="sans" font-size="12" fill="#ff7b72" text-anchor="end">Token unknown or expired</text>
  <text x="724" y="560" class="sans" font-size="12" fill="#ff7b72" text-anchor="end">(an expired row is deleted)</text>
  <text x="245" y="553" class="sans label" text-anchor="middle" style="fill:#ff7b72">401 → app signs out</text>
  <line x1="376" y1="568" x2="114" y2="568" stroke="#ff7b72" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>

  <!-- Step numbers -->
  <g class="sans" text-anchor="middle">
    <circle cx="110" cy="132" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="110" y="136" class="num">1</text>
    <circle cx="270" cy="175" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="270" y="179" class="num">2</text>
    <circle cx="380" cy="236" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="380" y="240" class="num">3</text>
    <circle cx="650" cy="278" r="10" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <text x="650" y="282" class="num">4</text>
    <circle cx="225" cy="328" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="225" y="332" class="num">5</text>
    <circle cx="380" cy="398" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="380" y="402" class="num">6</text>
    <circle cx="380" cy="494" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="380" y="498" class="num">7</text>
  </g>
</svg>
